<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F8FA" id="meta-theme-color" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>AeroMetric UA — Метео для БПЛА</title>
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=20261122_19" />
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Pinned Top Header: Profiles & Quick Actions -->
    <header class="top-bar">
      <div class="top-profile-wrap">
        <button class="top-profile-btn active" data-flight-profile="fpv">FPV (до 70 м)</button>
        <button class="top-profile-btn" data-flight-profile="wing">Крила (300–1000 м)</button>
      </div>

      <div class="top-actions">
        <button id="btn-theme" class="icon-btn" title="Змінити тему" aria-label="Змінити тему">
          <svg id="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          <svg id="icon-moon" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
        <button id="btn-refresh" class="icon-btn" title="Оновити прогноз" aria-label="Оновити">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
      </div>
    </header>

    <!-- Main Scrollable Viewport -->
    <main id="main-content" class="main-content">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Завантажую погодні моделі ICON-EU, ECMWF, GFS...</p>
      </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" aria-label="Навігація">
      <button class="nav-item active" data-tab="conditions">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
        <span>Умови</span>
      </button>
      <button class="nav-item" data-tab="altitudes">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/><path d="M12 9v12"/><path d="M5 5h14"/></svg>
        <span>Ешелони</span>
      </button>
      <button class="nav-item" data-tab="week">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/></svg>
        <span>Тиждень</span>
      </button>
      <button class="nav-item" data-tab="settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>Налаштування</span>
      </button>
    </nav>
  </div>

  <!-- Location Modal -->
  <div id="modal-location" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop"></div>
    <div class="modal-sheet">
      <div class="modal-header">
        <h2>Локація в Україні</h2>
        <button class="icon-btn modal-close" aria-label="Закрити">✕</button>
      </div>
      <div class="modal-body">
        <div class="search-row">
          <input id="input-search-city" type="text" placeholder="Місто або координати..." autocomplete="off" />
          <button id="btn-gps" class="btn-secondary" title="Моя геолокація">GPS</button>
        </div>
        <div id="search-results" class="search-results hidden"></div>

        <div class="preset-group">
          <div class="preset-title">Донецька область</div>
          <div id="presets-donetsk" class="preset-chips"></div>
        </div>

        <div class="preset-group">
          <div class="preset-title">Інші міста України</div>
          <div id="presets-ukraine" class="preset-chips"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Models Info Modal -->
  <div id="modal-models" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop"></div>
    <div class="modal-sheet">
      <div class="modal-header">
        <h2>Погодні моделі: яку обрати?</h2>
        <button class="icon-btn modal-close" aria-label="Закрити">✕</button>
      </div>
      <div id="modal-models-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Metric Detail Modal on Card Tap -->
  <div id="modal-metric-detail" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop"></div>
    <div class="modal-sheet">
      <div class="modal-header">
        <h2 id="modal-metric-title">Деталі показника</h2>
        <button class="icon-btn modal-close" aria-label="Закрити">✕</button>
      </div>
      <div id="modal-metric-body" class="modal-body" style="padding:14px 16px;display:flex;flex-direction:column;gap:12px;"></div>
    </div>
  </div>

  <script type="module" src="./js/app.js?v=20261122_19"></script>
</body>
</html>
